<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LanguageToken — demo stage</title>
<link rel="stylesheet" href="/common.css">
<style>
  body { background: #e9e4da; }
  .stage { display: grid; grid-template-columns: minmax(430px, 520px) 1fr; gap: 1.5rem; max-width: 1500px; margin: 0 auto; padding: 1.25rem 1.5rem 2rem; align-items: start; }
  @media (max-width: 1080px) { .stage { grid-template-columns: 1fr; } }
  .head { display: flex; align-items: center; gap: .75rem; flex-wrap: wrap; max-width: 1500px; margin: 0 auto; padding: 1.25rem 1.5rem .25rem; }
  .head .brand { font-size: 1.15rem; }
  .head .grow { flex: 1; }
  .head .badge { font-size: .82rem; padding: .3rem .7rem; }
  .device { background: #1c1a17; border-radius: 34px; padding: 12px; box-shadow: 0 24px 70px rgba(28,26,23,.28); }
  .device iframe { width: 100%; height: 860px; border: 0; border-radius: 24px; background: var(--bg); display: block; }
  .device .chin { text-align: center; color: #8f887d; font-size: .72rem; padding-top: .5rem; letter-spacing: .06em; text-transform: uppercase; }
  .panels { display: grid; gap: 1rem; }
  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: .6rem; }
  .stat { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: .7rem .8rem; }
  .stat .k { font-size: .7rem; text-transform: uppercase; letter-spacing: .06em; color: var(--ink-3); }
  .stat .v { font-size: 1.5rem; font-weight: 800; letter-spacing: -.02em; line-height: 1.1; }
  .feed { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: .8rem .9rem; }
  .feed h2 { display: flex; align-items: center; gap: .5rem; }
  .rows { max-height: 300px; overflow-y: auto; font-family: var(--mono); font-size: .78rem; }
  .row { padding: .3rem .1rem; border-bottom: 1px dashed var(--line); display: flex; gap: .6rem; align-items: baseline; }
  .row:last-child { border-bottom: 0; }
  .row .nm { font-weight: 700; color: var(--accent); white-space: nowrap; }
  .row .dt { color: var(--ink-2); word-break: break-all; }
  .row.fresh { animation: pop 1.2s ease-out; }
  @keyframes pop { from { background: var(--amber-soft); } to { background: transparent; } }
  .stock { display: flex; flex-wrap: wrap; gap: .4rem; }
  .stock span { font-size: .78rem; }
  .conserve { display: flex; align-items: center; gap: .5rem; font-size: .85rem; }
  .codes { font-family: var(--mono); font-size: .78rem; word-break: break-all; }
</style>
</head>
<body>
<div class="head">
  <div class="brand"><span class="leaf">🍁</span> LanguageToken</div>
  <span class="badge" id="ledger">…</span>
  <span class="badge" id="addr" style="display:none"></span>
  <div class="grow"></div>
  <span class="tiny" id="conn">connecting…</span>
</div>
<div class="stage">
  <div>
    <div class="device">
      <iframe id="phone" src="/learner/" title="Learner app"></iframe>
      <div class="chin">learner · the only screen a newcomer sees</div>
    </div>
    <p class="tiny" style="margin-top:.6rem">Participation codes for this run: <span class="codes" id="codes">…</span></p>
  </div>
  <div class="panels">
    <div class="tiles" id="tiles"></div>
    <div class="feed">
      <h2>Ledger <span class="badge" id="ledger2">…</span></h2>
      <div class="conserve" id="conserve"></div>
      <div class="rows" id="events"><p class="tiny">Nothing yet. Complete a mission on the left.</p></div>
    </div>
    <div class="feed">
      <h2>Catalog stock</h2>
      <div class="stock" id="stock"></div>
      <p class="tiny" style="margin:.6rem 0 0">100 credits = CAD 5, fixed by the catalog. Stock is what a sponsor has already funded — nothing is listed beyond it.</p>
    </div>
  </div>
</div>
<script src="/demo/app.js"></script>
</body>
</html>
