# Every push and pull request runs the same suites a judge would run by hand.
#
# The service itself has no runtime dependencies, so the server job installs
# nothing — that is the point, and CI proves it rather than claiming it.
name: tests

on:
  push:
  pull_request:

jobs:
  server:
    name: server, end-to-end and parity (${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["20", "22"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      # No npm install: server/ is plain Node. The parity suite skips itself,
      # loudly, because no chain runs here.
      - run: npm test

  contracts:
    name: Solidity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: contracts/package-lock.json
      - run: npm ci
        working-directory: contracts
      - run: npx hardhat test
        working-directory: contracts
